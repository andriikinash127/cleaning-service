{% extends "base.html" %}
{% load static %}

{% block content %}
  <div class="page-hero page-hero--violet">
    <div class="page-hero-inner container">
      <div class="page-hero-text">
        <h1 class="page-hero-title">Account</h1>
      </div>
      <img
        src="{% static 'cleaning/images/badge_account_frog.svg' %}"
        alt=""
        class="page-hero-art"
      >
    </div>
  </div>

  <h1 class="page-title">Login</h1>

  <div class="form-card">
    <form method="post" class="styled-form styled-form--violet">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit" class="btn-pill btn-pill-hero--violet">Login</button>
    </form>
  </div>
{% endblock %}
