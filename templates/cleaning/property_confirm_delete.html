{% extends "base.html" %}
{% load static %}

{% block content %}
  <div class="page-hero page-hero--blue">
    <div class="page-hero-inner container">
    <div class="page-hero-text">
      <p class="page-hero-title">Properties</p>
    </div>
    <img
      src="{% static 'cleaning/images/badge_properties_fox.svg' %}"
      alt=""
      class="page-hero-art"
    >
    </div>
  </div>

  <h1 class="page-title">Delete Property</h1>

  <div class="confirm-box">
    <p>Are you sure you want to delete "{{ property.name }}"?</p>

    <div class="actions-row">
      <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn-pill btn-pill-hero-outline--blue">Delete</button>
      </form>

      <a href="{% url 'cleaning:property-detail' property.pk %}" class="btn-pill btn-pill-outline">
        Cancel
      </a>
    </div>
  </div>
{% endblock %}
